name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run; no release is published)"
        required: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-universal

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin, x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      # -------------------------------------------------------------------
      # Windows: both binaries plus the registration scripts, so the zip is
      # self-contained -- unzip, run register.ps1, done.
      # -------------------------------------------------------------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          $out = "dist/RightClickSymlink-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/rcsym.exe, target/release/rcsymw.exe $out
          Copy-Item platform/windows/register.ps1, platform/windows/unregister.ps1 $out
          Copy-Item platform/windows/README.md $out/INSTALL.md
          Copy-Item LICENSE $out
          Compress-Archive -Path "$out/*" -DestinationPath "dist/RightClickSymlink-windows-x64.zip"

      # -------------------------------------------------------------------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          out="dist/RightClickSymlink-linux-x64"
          mkdir -p "$out"
          cp target/release/rcsym "$out/"
          cp -r platform/linux "$out/integration"
          cp platform/linux/README.md "$out/INSTALL.md"
          cp LICENSE "$out/"
          tar -czf dist/RightClickSymlink-linux-x64.tar.gz -C dist RightClickSymlink-linux-x64

      # -------------------------------------------------------------------
      # macOS: the full .app, ad-hoc signed.
      #
      # NOT notarized -- that needs a paid Apple Developer account and secrets
      # this workflow does not have. Gatekeeper will warn on another machine;
      # right-click > Open is the workaround. See platform/macos/README.md.
      # -------------------------------------------------------------------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./platform/macos/build.sh
          out="dist/RightClickSymlink-macos-universal"
          mkdir -p "$out"
          cp -R platform/macos/build/RightClickSymlink.app "$out/"
          cp platform/macos/README.md "$out/INSTALL.md"
          cp LICENSE "$out/"
          # ditto rather than zip: it preserves the bundle's symlinks and
          # extended attributes, which a plain zip silently flattens.
          ditto -c -k --sequesterRsrc --keepParent "$out" dist/RightClickSymlink-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show what is being published
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          generate_release_notes: true
          body: |
            ## Install

            **Windows** — unzip, then:
            ```powershell
            .\register.ps1
            ```
            On Windows 11 the entries appear under "Show more options".

            **macOS** — unzip, drag the app to `/Applications`, open it once,
            then enable it in System Settings › General › Login Items &
            Extensions › Finder Extensions.

            Not notarized: macOS will warn on first open. Right-click › Open.

            **Linux** — extract, then:
            ```bash
            ./integration/install.sh --bin ./rcsym
            ```

            ---

            Creating a link never overwrites anything. See the README for what
            that guarantees and where the real hazards are.
