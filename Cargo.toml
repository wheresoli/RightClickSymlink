[workspace]
members = ["crates/symlink-core", "crates/rcsym"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/wheresoli/RightClickSymlink"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
