[package]
name = "rcsym"
description = "Right-click symlink helper: dialogs plus a headless link command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Two front ends over one `run()`:
#   rcsym   - console subsystem. Scripting, `probe`, `link`, CI.
#   rcsymw  - GUI subsystem on Windows, so invoking it from a context menu does
#             not flash a console window. This is the one the registry points at.
[[bin]]
name = "rcsym"
path = "src/bin/rcsym.rs"

[[bin]]
name = "rcsymw"
path = "src/bin/rcsymw.rs"

[dependencies]
symlink-core = { path = "../symlink-core" }
clap = { version = "4", features = ["derive"] }
# default-features = false drops rfd's "wayland" feature, which exists to
# parent a dialog to a Wayland surface. This process has no window -- it is
# invoked by a context menu, pops a dialog, and exits -- so there is nothing to
# parent to, and the feature only adds a link-time dependency on
# libwayland-client that would make every Linux build need libwayland-dev.
#
# xdg-portal still handles the dialogs themselves, on X11 and Wayland alike;
# the portal is a D-Bus service and does not care which compositor is running.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
